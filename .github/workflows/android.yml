name: Build Real APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Project Structure and Accept SDK Licenses
      run: |
        # إنشاء المجلدات الأساسية
        mkdir -p app/src/main/java/com/royal/poetry/master
        mkdir -p app/src/main/res/values

        # حقن رخص أندرويد تلقائياً لمنع توقف السيرفر
        ANDROID_HOME=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}
        mkdir -p $ANDROID_HOME/licenses
        echo -e "\n24333f8a63b6825ea3c5514f03c2eb1ce6296d3f" > $ANDROID_HOME/licenses/android-sdk-license
        echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" >> $ANDROID_HOME/licenses/android-sdk-license

        # 1. AndroidManifest
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <manifest xmlns:android="http://schemas.android.com/apk/res/android"
            package="com.royal.poetry.master">
            <application android:label="تستحق ذلك">
                <activity android:name=".MainActivity" android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        # 2. MainActivity
        cat << 'EOF' > app/src/main/java/com/royal/poetry/master/MainActivity.java
        package com.royal.poetry.master;
        import android.os.Bundle;
        import androidx.appcompat.app.AppCompatActivity;
        public class MainActivity extends AppCompatActivity {
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
            }
        }
        EOF

        # 3. app/build.gradle
        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
        }
        android {
            namespace 'com.royal.poetry.master'
            compileSdk 33
            defaultConfig {
                applicationId "com.royal.poetry.master"
                minSdk 24
                targetSdk 33
                versionCode 1
                versionName "1.0"
            }
        }
        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
        }
        EOF

        # 4. Root build.gradle
        cat << 'EOF' > build.gradle
        plugins {
            id 'com.android.application' version '8.1.1' apply false
        }
        EOF

        # 5. settings.gradle
        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "Test"
        include ':app'
        EOF

        # تحميل وتثبيت Gradle 8.2
        wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip
        unzip -q gradle-8.2-bin.zip
        echo "$PWD/gradle-8.2/bin" >> $GITHUB_PATH
        gradle wrapper --gradle-version 8.2
        chmod +x ./gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: testahstha-thalk-apk
        path: app/build/outputs/apk/debug/app-debug.apk
