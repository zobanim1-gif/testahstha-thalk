name: Build Real APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Build APK Now
      run: |
        mkdir -p app/src/main/java/com/royal/poetry/master app/src/main/res/values

        cat << 'EOF' > settings.gradle
        pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
        dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
        rootProject.name = "Test"
        include ':app'
        EOF

        cat << 'EOF' > build.gradle
        plugins { id 'com.android.application' version '8.1.1' apply false }
        EOF

        cat << 'EOF' > app/build.gradle
        plugins { id 'com.android.application' }
        android { namespace 'com.royal.poetry.master'; compileSdk 33; defaultConfig { applicationId 'com.royal.poetry.master'; minSdk 24; targetSdk 33 } }
        dependencies { implementation 'androidx.appcompat:appcompat:1.6.1' }
        EOF

        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.royal.poetry.master">
        <application android:label="تستحق ذلك"><activity android:name=".MainActivity" android:exported="true">
        <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
        </activity></application></manifest>
        EOF

        cat << 'EOF' > app/src/main/java/com/royal/poetry/master/MainActivity.java
        package com.royal.poetry.master;
        import android.os.Bundle;
        import androidx.appcompat.app.AppCompatActivity;
        public class MainActivity extends AppCompatActivity {
            protected void onCreate(Bundle s) { super.onCreate(s); }
        }
        EOF

        wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip
        unzip -q gradle-8.2-bin.zip
        export PATH=$PWD/gradle-8.2/bin:$PATH
        
        gradle wrapper --gradle-version 8.2
        chmod +x ./gradlew
        ./gradlew assembleDebug

    - uses: actions/upload-artifact@v4
      with:
        name: apk
        path: app/build/outputs/apk/debug/app-debug.apk
