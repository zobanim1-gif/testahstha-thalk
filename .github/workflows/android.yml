name: Build Real APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Project and Generate Wrapper
      run: |
        # التأكد من مجلدات المشروع الأساسية
        mkdir -p app/src/main/java/com/royal/poetry/master
        mkdir -p app/src/main/res/values
        mkdir -p app/src/main/res/layout

        # 1. AndroidManifest.xml
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <manifest xmlns:android="http://schemas.android.com/apk/res/android"
            package="com.royal.poetry.master">
            <application
                android:allowBackup="true"
                android:label="تستحق ذلك"
                android:theme="@style/Theme.AppCompat.Light.DarkActionBar">
                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        # 2. MainActivity.java
        cat << 'EOF' > app/src/main/java/com/royal/poetry/master/MainActivity.java
        package com.royal.poetry.master;
        import android.os.Bundle;
        import androidx.appcompat.app.AppCompatActivity;
        public class MainActivity extends AppCompatActivity {
            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                setContentView(android.R.layout.activity_list_item);
            }
        }
        EOF

        # 3. app/build.gradle
        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
        }
        android {
            namespace 'com.royal.poetry.master'
            compileSdk 34
            defaultConfig {
                applicationId "com.royal.poetry.master"
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }
        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
        }
        EOF

        # 4. build.gradle الرئيسي
        cat << 'EOF' > build.gradle
        plugins {
            id 'com.android.application' version '8.1.1' apply false
        }
        EOF

        # 5. settings.gradle
        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "TestahsthaThalk"
        include ':app'
        EOF

        # تحميل Gradle وتثبيته وتوليد ملفات الـ Wrapper محلياً في المشروع
        wget https://services.gradle.org/distributions/gradle-8.2-bin.zip
        unzip -q gradle-8.2-bin.zip
        ./gradle-8.2/bin/gradle wrapper --gradle-version 8.2

        # منح صلاحية التنفيذ لملف gradlew الجديد
        chmod +x ./gradlew

    - name: Build Debug APK with gradlew
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: testahstha-thalk-apk
        path: app/build/outputs/apk/debug/app-debug.apk
