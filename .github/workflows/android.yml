name: Build Real APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Prepare Project Structure and Wrapper
      run: |
        # التأكد من وجود مجلد app و src/main
        mkdir -p app/src/main
        
        # تحميل وتثبيت Gradle 8.2 مباشرة
        wget https://services.gradle.org/distributions/gradle-8.2-bin.zip
        unzip -q gradle-8.2-bin.zip
        echo "$PWD/gradle-8.2/bin" >> $GITHUB_PATH
        
        # توليد ملفات الـ Wrapper لتنظيم العمل
        gradle wrapper --gradle-version 8.2

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: testahstha-thalk-apk
        path: app/build/outputs/apk/debug/app-debug.apk
