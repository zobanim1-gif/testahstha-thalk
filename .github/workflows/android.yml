name: Build Real APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - uses: android-actions/setup-android@v3

    - name: Generate App Files
      run: |
        mkdir -p app/src/main/java/com/royal/poetry/master app/src/main/res/values
        
        echo '<manifest package="com.royal.poetry.master"><application android:label="تستحق ذلك"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>' > app/src/main/AndroidManifest.xml
        
        echo 'package com.royal.poetry.master; import android.os.Bundle; import androidx.appcompat.app.AppCompatActivity; public class MainActivity extends AppCompatActivity { protected void onCreate(Bundle s) { super.onCreate(s); } }' > app/src/main/java/com/royal/poetry/master/MainActivity.java
        
        echo "plugins { id 'com.android.application' } android { namespace 'com.royal.poetry.master' compileSdk 33 defaultConfig { applicationId 'com.royal.poetry.master' minSdk 24 targetSdk 33 } } dependencies { implementation 'androidx.appcompat:appcompat:1.6.1' }" > app/build.gradle
        
        echo "plugins { id 'com.android.application' version '8.1.1' apply false }" > build.gradle
        
        echo "pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } } dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } } rootProject.name='Test'; include ':app'" > settings.gradle
        
        gradle wrapper --gradle-version 8.2
        chmod +x ./gradlew

    - name: Build APK
      run: ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: testahstha-thalk-apk
        path: app/build/outputs/apk/debug/app-debug.apk
